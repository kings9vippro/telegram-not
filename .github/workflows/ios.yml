name: iOS build
on:
  workflow_dispatch:
  push:
    paths:
      - 'rust/**'
      - 'ios/**'
      - 'project.yml'
      - '.github/workflows/ios.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build Rust for iOS
        run: cargo build --manifest-path rust/Cargo.toml --release --target aarch64-apple-ios
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build iPhone app
        run: xcodebuild -project Yanbi.xcodeproj -scheme Yanbi -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Yanbi.app Payload/
          zip -qry Yanbi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Yanbi-unsigned-ipa
          path: Yanbi-unsigned.ipa
